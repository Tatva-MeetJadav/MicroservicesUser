<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResetPasswordLink</title>
  </head>
  <body>
    <div style="width: 100%">
      <div>
        <div
          style="
            background-color: teal;
            font-size: large;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            color: white;
          "
        >
          Hello, Company User,
        </div>
        <div style="margin-top: 10px">
          <span>Please click</span>
          <a
            href="{{ResetPasswordLink}}"
            style="color: skyblue; text-decoration: underline"
            >Here</a
          >
          <span>to reset your account password.</span>
        </div>
        <div>
          <span style="color: red">Important Note:</span>
          <span
            >For security reasons, link will be expire in 24 hours, if you did
            not request a password reset, please ignore this email or contact
            our support immediately.</span
          >
        </div>
      </div>
    </div>
  </body>
</html>
